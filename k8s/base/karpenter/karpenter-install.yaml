# Karpenter Installation — Helm command reference (PETPLAT-73)
#
# Karpenter is installed via Helm from the OCI registry.
# This file documents the install command with resolved Terraform output values.
# It is NOT applied with kubectl — run the helm command below directly.
#
# Prerequisites:
#   - terraform apply completed for dev environment (karpenter module)
#   - kubectl configured: aws eks update-kubeconfig --name petclinic-dev --region us-east-1
#   - helm CLI installed and logged into ECR public:
#       aws ecr-public get-login-password --region us-east-1 | \
#         helm registry login --username AWS --password-stdin public.ecr.aws
#
# ─── Install command (dev) ─────────────────────────────────────────────────────
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#     --version 1.0.0 \
#     --namespace kube-system \
#     --create-namespace \
#     --set settings.clusterName=petclinic-dev \
#     --set settings.interruptionQueue=petclinic-dev-karpenter-interruption \
#     --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::820444288149:role/petclinic-dev-karpenter-role" \
#     --set controller.resources.requests.cpu=100m \
#     --set controller.resources.requests.memory=256Mi \
#     --set controller.resources.limits.cpu=1 \
#     --set controller.resources.limits.memory=512Mi \
#     --wait
#
# Or using terraform output substitution directly:
#
#   CLUSTER_NAME=$(terraform -chdir=terraform/environments/dev output -raw eks_cluster_name)
#   QUEUE_NAME=$(terraform -chdir=terraform/environments/dev output -raw karpenter_queue_name)
#   ROLE_ARN=$(terraform -chdir=terraform/environments/dev output -raw karpenter_role_arn)
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#     --version 1.0.0 \
#     --namespace kube-system \
#     --create-namespace \
#     --set settings.clusterName="${CLUSTER_NAME}" \
#     --set settings.interruptionQueue="${QUEUE_NAME}" \
#     --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${ROLE_ARN}" \
#     --set controller.resources.requests.cpu=100m \
#     --set controller.resources.requests.memory=256Mi \
#     --set controller.resources.limits.cpu=1 \
#     --set controller.resources.limits.memory=512Mi \
#     --wait
#
# ─── Verify ────────────────────────────────────────────────────────────────────
#
#   kubectl get pods -n kube-system -l app.kubernetes.io/name=karpenter
#   kubectl logs -n kube-system -l app.kubernetes.io/name=karpenter --tail=50
#
# ─── After install ─────────────────────────────────────────────────────────────
#
#   kubectl apply -f k8s/base/karpenter/nodepool.yaml
#
# ─── Terraform output values (resolved at time of writing) ────────────────────
#
#   eks_cluster_name:        petclinic-dev
#   karpenter_queue_name:    petclinic-dev-karpenter-interruption
#   karpenter_role_arn:      arn:aws:iam::820444288149:role/petclinic-dev-karpenter-role
#   karpenter_profile_name:  petclinic-dev-karpenter-node-profile
#
