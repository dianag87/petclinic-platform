apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
type: Opaque
stringData:
  admin-user: admin
  admin-password: petclinic-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: petclinic
        orgId: 1
        folder: Petclinic
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /opt/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
data:
  overview.json: |
    {
      "title": "Petclinic Service Overview",
      "uid": "petclinic-overview",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "tags": ["petclinic"],
      "annotations": {"list": []},
      "templating": {"list": []},
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Service Status",
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "up{job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}",
              "legendFormat": "{{job}}",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"text": "DOWN", "color": "red", "index": 0},
                    "1": {"text": "UP", "color": "green", "index": 1}
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]
              },
              "color": {"mode": "thresholds"}
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request Rate (RPS)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}[5m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps", "custom": {"lineWidth": 2, "fillOpacity": 10}},
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error Rate (5xx)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\",job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}[5m])) by (job) / sum(rate(http_server_requests_seconds_count{job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}[5m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "custom": {"lineWidth": 2, "fillOpacity": 10}},
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "P95 / P99 Latency",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}[5m])) by (job, le))",
              "legendFormat": "p95 {{job}}"
            },
            {
              "refId": "B",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=~\"api-gateway|customers-service|visits-service|vets-service|genai-service\"}[5m])) by (job, le))",
              "legendFormat": "p99 {{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s", "custom": {"lineWidth": 2, "fillOpacity": 10}},
            "overrides": []
          }
        }
      ]
    }

